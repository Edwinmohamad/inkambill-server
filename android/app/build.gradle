plugins {
    id "com.android.application"
}

def releaseKeystorePath = System.getenv("ANDROID_KEYSTORE_PATH")
def releaseKeystorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("ANDROID_KEY_ALIAS")
def releaseKeyPassword = System.getenv("ANDROID_KEY_PASSWORD")
def releaseSigningReady = releaseKeystorePath && releaseKeystorePassword && releaseKeyAlias && releaseKeyPassword
def quotedEnv = { name ->
    def value = System.getenv(name) ?: ""
    return '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"'
}

android {
    namespace "id.my.edwinpxmx.inkamnetgo"
    compileSdk 35

    defaultConfig {
        applicationId "id.my.edwinpxmx.inkamnetgo"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "1.1.0"
        buildConfigField "String", "FIREBASE_APPLICATION_ID", quotedEnv("FIREBASE_ANDROID_APPLICATION_ID")
        buildConfigField "String", "FIREBASE_API_KEY", quotedEnv("FIREBASE_ANDROID_API_KEY")
        buildConfigField "String", "FIREBASE_PROJECT_ID", quotedEnv("FIREBASE_ANDROID_PROJECT_ID")
        buildConfigField "String", "FIREBASE_SENDER_ID", quotedEnv("FIREBASE_ANDROID_SENDER_ID")
    }

    buildFeatures { buildConfig true }

    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            if (releaseSigningReady) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.biometric:biometric:1.1.0"
    implementation "androidx.work:work-runtime:2.10.0"
    implementation platform("com.google.firebase:firebase-bom:33.7.0")
    implementation "com.google.firebase:firebase-messaging"
}
