name: Build INKAMNET GO APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

concurrency:
  group: inkamnet-go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Validate and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      FIREBASE_ANDROID_APPLICATION_ID: ${{ secrets.FIREBASE_ANDROID_APPLICATION_ID }}
      FIREBASE_ANDROID_API_KEY: ${{ secrets.FIREBASE_ANDROID_API_KEY }}
      FIREBASE_ANDROID_PROJECT_ID: ${{ secrets.FIREBASE_ANDROID_PROJECT_ID }}
      FIREBASE_ANDROID_SENDER_ID: ${{ secrets.FIREBASE_ANDROID_SENDER_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate Android project
        run: node scripts/test-android-app.js

      - name: Run Android lint
        working-directory: android
        run: gradle --no-daemon lintDebug

      - name: Build installable APK
        run: |
          mkdir -p android/app/build/outputs/final
          if [ -n "${ANDROID_KEYSTORE_BASE64}" ] && [ -n "${ANDROID_KEYSTORE_PASSWORD}" ] && [ -n "${ANDROID_KEY_ALIAS}" ] && [ -n "${ANDROID_KEY_PASSWORD}" ]; then
            printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > android/ci-release.jks
            export ANDROID_KEYSTORE_PATH="${GITHUB_WORKSPACE}/android/ci-release.jks"
            (cd android && gradle --no-daemon assembleRelease)
            cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/final/INKAMNET-GO-v1.3.0.apk
            APK_PACKAGE="id.my.edwinpxmx.inkamnetgo"
            echo "APK_PACKAGE=id.my.edwinpxmx.inkamnetgo" >> "${GITHUB_ENV}"
            echo "APK_VARIANT=release" >> "${GITHUB_ENV}"
          else
            (cd android && gradle --no-daemon assembleDebug)
            cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/final/INKAMNET-GO-v1.3.0.apk
            APK_PACKAGE="id.my.edwinpxmx.inkamnetgo.debug"
            echo "APK_PACKAGE=id.my.edwinpxmx.inkamnetgo.debug" >> "${GITHUB_ENV}"
            echo "APK_VARIANT=debug" >> "${GITHUB_ENV}"
          fi
          rm -f android/ci-release.jks
          printf '%s' "${APK_PACKAGE}" > android/app/build/outputs/final/package-name.txt
          printf '%s\n' '{"versionCode":5,"versionName":"1.3.0"}' > android/app/build/outputs/final/version.json
          echo "APK_PATH=${GITHUB_WORKSPACE}/android/app/build/outputs/final/INKAMNET-GO-v1.3.0.apk" >> "${GITHUB_ENV}"

      - name: Verify APK
        run: |
          test -s "${APK_PATH}"
          unzip -t "${APK_PATH}"
          AAPT_BIN="$(find "${ANDROID_HOME}/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER_BIN="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "${AAPT_BIN}"
          test -x "${APKSIGNER_BIN}"
          "${APKSIGNER_BIN}" verify --verbose --print-certs "${APK_PATH}" | tee android/app/build/outputs/final/signature-info.txt
          "${AAPT_BIN}" dump badging "${APK_PATH}" | tee android/app/build/outputs/final/apk-info.txt
          grep -q "package: name='${APK_PACKAGE}'" android/app/build/outputs/final/apk-info.txt
          grep -q "application-label:'INKAMNET GO'" android/app/build/outputs/final/apk-info.txt
          grep -q "versionCode='5'" android/app/build/outputs/final/apk-info.txt
          cp android/app/build/reports/lint-results-debug.html android/app/build/outputs/final/lint-results-debug.html

      - name: Upload installable APK
        uses: actions/upload-artifact@v5
        with:
          name: INKAMNET-GO-APK
          path: android/app/build/outputs/final/*
          if-no-files-found: error
          retention-days: 30

  emulator-smoke:
    name: Android ${{ matrix.api }} install test
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [29, 31, 34, 35]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download APK artifact
        uses: actions/download-artifact@v5
        with:
          name: INKAMNET-GO-APK
          path: android-artifact

      - name: Install and launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash scripts/android-emulator-smoke.sh "${{ matrix.api }}" "${GITHUB_WORKSPACE}/android-artifact"

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: INKAMNET-GO-emulator-Android-${{ matrix.api }}
          path: |
            emulator-launch-${{ matrix.api }}.txt
            emulator-smoke-${{ matrix.api }}.png
            emulator-logcat-${{ matrix.api }}.txt
          if-no-files-found: error
          retention-days: 14

  publish-internal:
    name: Publish APK to INKAMNET server
    needs: [build-apk, emulator-smoke]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10

    steps:
      - name: Download verified APK
        uses: actions/download-artifact@v5
        with:
          name: INKAMNET-GO-APK
          path: mobile-release

      - name: Publish atomically
        run: |
          test -s mobile-release/INKAMNET-GO-v1.3.0.apk
          install -d -m 0755 /opt/inkambilling/storage/mobile-releases
          install -m 0644 mobile-release/INKAMNET-GO-v1.3.0.apk /opt/inkambilling/storage/mobile-releases/INKAMNET-GO.apk.new
          install -m 0644 mobile-release/version.json /opt/inkambilling/storage/mobile-releases/version.json.new
          mv /opt/inkambilling/storage/mobile-releases/INKAMNET-GO.apk.new /opt/inkambilling/storage/mobile-releases/INKAMNET-GO.apk
          mv /opt/inkambilling/storage/mobile-releases/version.json.new /opt/inkambilling/storage/mobile-releases/version.json
          test -s /opt/inkambilling/storage/mobile-releases/INKAMNET-GO.apk
