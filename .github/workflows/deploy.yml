name: Deploy INKAMBILLING

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: inkambilling-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 35
    steps:
      - name: Update production source
        shell: bash
        run: |
          set -euo pipefail
          cd /opt/inkambilling
          git fetch origin main
          # Simpan dulu perubahan lokal di server (kalau ada) sebelum disamakan dengan GitHub,
          # supaya edit manual di server tidak hilang begitu saja dan tidak memblokir deploy.
          if ! git diff --quiet || ! git diff --cached --quiet; then
            mkdir -p $HOME/inkambilling-local-changes
            BACKUP="$HOME/inkambilling-local-changes/$(date +%Y%m%d-%H%M%S).patch"
            git diff HEAD > "$BACKUP"
            echo "Perubahan lokal di server disimpan ke $BACKUP:"
            git status --short
          fi
          git reset --hard origin/main

      - name: Backup production database
        shell: bash
        run: |
          set -euo pipefail
          cd /opt/inkambilling
          sh backup.sh

      - name: Rebuild and restart application
        shell: bash
        run: |
          set -euo pipefail
          cd /opt/inkambilling
          docker compose up -d --build
          docker compose ps

      - name: Verify application health
        shell: bash
        run: |
          set -euo pipefail
          # Server baru listen setelah seluruh migrasi schema selesai; beri waktu sampai 5 menit
          # (sebelumnya 60 detik) supaya restart dengan migrasi tidak dianggap gagal.
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:3301/healthz; then exit 0; fi
            sleep 5
          done
          docker compose logs app --tail=120
          exit 1
