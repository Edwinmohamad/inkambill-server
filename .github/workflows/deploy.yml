name: Deploy INKAMBILLING

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: inkambilling-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 35
    steps:
      - name: Update production source
        shell: bash
        run: |
          set -euo pipefail
          cd /opt/inkambilling
          git fetch origin main
          git pull --ff-only origin main

      - name: Backup production database
        shell: bash
        run: |
          set -euo pipefail
          cd /opt/inkambilling
          sh backup.sh

      - name: Rebuild and restart application
        shell: bash
        run: |
          set -euo pipefail
          cd /opt/inkambilling
          docker compose up -d --build
          docker compose ps

      - name: Verify application health
        shell: bash
        run: |
          set -euo pipefail
          # Server baru listen setelah seluruh migrasi schema selesai; beri waktu sampai 5 menit
          # (sebelumnya 60 detik) supaya restart dengan migrasi tidak dianggap gagal.
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:3301/healthz; then exit 0; fi
            sleep 5
          done
          docker compose logs app --tail=120
          exit 1
