name: Deploy INKAMBILLING

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: inkambilling-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 35
    steps:
      - name: Update production source
        shell: bash
        run: |
          set -euo pipefail
          cd /opt/inkambilling
          git fetch origin main
          # Simpan dulu perubahan lokal di server (kalau ada) sebelum disamakan dengan GitHub,
          # supaya edit manual di server tidak hilang begitu saja dan tidak memblokir deploy.
          if ! git diff --quiet || ! git diff --cached --quiet; then
            mkdir -p $HOME/inkambilling-local-changes
            BACKUP="$HOME/inkambilling-local-changes/$(date +%Y%m%d-%H%M%S).patch"
            git diff HEAD > "$BACKUP"
            echo "Perubahan lokal di server disimpan ke $BACKUP:"
            git status --short
          fi
          git reset --hard origin/main

      - name: Validate candidate before production restart
        shell: bash
        run: |
          set -euo pipefail
          cd /opt/inkambilling
          CANDIDATE_IMAGE="inkambilling-validation:${{ github.sha }}"
          trap 'docker image rm "$CANDIDATE_IMAGE" >/dev/null 2>&1 || true' EXIT
          # Only committed source enters Docker; server uploads and backups stay outside.
          git archive HEAD | docker build -t "$CANDIDATE_IMAGE" -
          docker run --rm --network none "$CANDIDATE_IMAGE" npm run test:audit

      - name: Backup production database
        shell: bash
        run: |
          set -euo pipefail
          cd /opt/inkambilling
          sh backup.sh

      - name: Rebuild and restart application
        shell: bash
        run: |
          set -euo pipefail
          cd /opt/inkambilling
          BUILD_CONTEXT="$(mktemp -d)"
          trap 'rm -rf "$BUILD_CONTEXT"' EXIT
          git archive HEAD | tar -x -C "$BUILD_CONTEXT"
          du -sh "$BUILD_CONTEXT"
          INKAMBILL_BUILD_CONTEXT="$BUILD_CONTEXT" docker compose up -d --build
          docker compose ps

      - name: Verify application health
        shell: bash
        run: |
          set -euo pipefail
          # Server baru listen setelah seluruh migrasi schema selesai; beri waktu sampai 5 menit
          # (sebelumnya 60 detik) supaya restart dengan migrasi tidak dianggap gagal.
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:3301/healthz; then exit 0; fi
            sleep 5
          done
          docker compose logs app --tail=120
          exit 1

      - name: Reconcile orphaned draft Closing rows
        # Keep deleted cash journals from remaining in an active draft Closing calculation.
        shell: bash
        run: |
          set -euo pipefail
          cd /opt/inkambilling
          docker compose exec -T app node scripts/repair-orphaned-closing-entries.js

      - name: Report finance integrity and historical discrepancies
        # Visible warnings for legacy anomalies; SQL/query failures still fail this step.
        # Never alter historical money automatically or declare anomalies resolved.
        shell: bash
        run: |
          set -euo pipefail
          cd /opt/inkambilling
          docker compose exec -T app node scripts/audit-finance-snapshot.js --report-only
