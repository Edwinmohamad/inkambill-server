services:
  fmt-tbs-dashboard:
    build: .
    container_name: fmt-tbs-dashboard
    restart: unless-stopped
    ports:
      - "${FMT_PORT:-8096}:8096"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    environment:
      TZ: Asia/Jakarta
      PYTHONDONTWRITEBYTECODE: "1"
      FMT_ADMIN_USER: "${FMT_ADMIN_USER:-admin}"
      FMT_ADMIN_PASSWORD: "${FMT_ADMIN_PASSWORD:-admin}"
      FMT_SESSION_HOURS: "${FMT_SESSION_HOURS:-12}"
      FMT_MAX_UPLOAD_MB: "${FMT_MAX_UPLOAD_MB:-50}"
      FMT_COOKIE_SECURE: "${FMT_COOKIE_SECURE:-0}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8096/health', timeout=4).read()"]
      interval: 30s
      timeout: 6s
      retries: 4
      start_period: 20s
