{% extends "base.html" %}{% block content %}<div class="page-head"><div><span class="eyebrow">SYSTEM CONFIGURATION</span><h1>Branding & Site Context</h1><p>Configure product identity without changing source code.</p></div></div><div class="panel"><form class="form-grid" method="post" enctype="multipart/form-data" action="/settings/branding"><label>Application Title<input name="title" value="{{settings.get('title','FMT Operations Dashboard')}}" required></label><label>Subtitle<input name="subtitle" value="{{settings.get('subtitle','Facility Management Operations & Inventory System')}}" required></label><label>Division<input name="division" value="{{settings.get('division','FMT')}}"></label><label>Site<input name="site" value="{{settings.get('site','TBS')}}"></label><label>Environment<select name="environment"><option {% if settings.get('environment')=='PRODUCTION' %}selected{% endif %}>PRODUCTION</option><option {% if settings.get('environment')=='STAGING' %}selected{% endif %}>STAGING</option><option {% if settings.get('environment')=='DEVELOPMENT' %}selected{% endif %}>DEVELOPMENT</option></select></label><label>Footer<input name="footer" value="{{settings.get('footer','Powered by Edwin Mohamad')}}"></label><label class="span-2">BDX Logo<input type="file" name="logo" accept="image/png,image/jpeg,image/webp,.logo"><small>Supports PNG/JPG/WEBP and verified custom .logo image files.</small></label><div class="span-2"><button class="btn primary">Save Settings</button></div></form></div>{% endblock %}
