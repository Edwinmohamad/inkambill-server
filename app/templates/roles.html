{% extends "base.html" %}{% block content %}<div class="page-head"><div><span class="eyebrow">ACCESS CONTROL</span><h1>Roles & Permissions</h1><p>Role defaults can be refined per user from User Management.</p></div></div><form method="post" action="/roles"><div class="panel table-wrap"><table class="permission-table"><thead><tr><th>Permission</th>{% for role in roles %}<th>{{role}}</th>{% endfor %}</tr></thead><tbody>{% for perm in permissions %}<tr><td><code>{{perm}}</code></td>{% for role in roles %}<td><input type="checkbox" name="{{role}}:{{perm}}" {% if perm in matrix[role] %}checked{% endif %}></td>{% endfor %}</tr>{% endfor %}</tbody></table></div><div class="form-actions"><button class="btn primary">Save Role Matrix</button></div></form>{% endblock %}
